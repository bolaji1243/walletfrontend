<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification System</title>
    <link rel="stylesheet" href="notification.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="brand">
                <div class="brand-logo">F</div>
                <span class="brand-name">FastPay</span>
            </div>
            <nav class="nav">
                <a href="dashboard.html" class="nav-link">
                    <span class="nav-icon" aria-hidden="true">&#128202;</span>
                    <span>Dashboard</span>
                </a>
                <a href="saving.html" class="nav-link">
                    <span class="nav-icon" aria-hidden="true">&#128176;</span>
                    <span>Savings</span>
                </a>
                <a href="ai.html" class="nav-link">
                    <span class="nav-icon" aria-hidden="true">&#129302;</span>
                    <span>AI Assistant</span>
                </a>
                <a href="profile.html" class="nav-link">
                    <span class="nav-icon" aria-hidden="true">&#128100;</span>
                    <span>Profile</span>
                </a>
                <a href="settings.html" class="nav-link">
                    <span class="nav-icon" aria-hidden="true">&#9881;</span>
                    <span>Settings</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="container">
        <header class="header">
            <h1>Notifications</h1>
            <div class="header-actions">
                <button id="markAllRead" class="btn btn-secondary">Mark All as Read</button>
                <button id="clearAll" class="btn btn-danger">Clear All</button>
            </div>
        </header>

        <div class="notification-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="unread">Unread</button>
            <button class="filter-btn" data-filter="read">Read</button>
        </div>

        <div id="notificationContainer" class="notification-container">
            <!-- Notifications will be dynamically added here -->
        </div>

        <div id="notification-popup-root"></div>

        <div id="emptyState" class="empty-state">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <p>No notifications yet</p>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../js/fastpay-core.js"></script>
    <script src="notification.js"></script>
</body>
</html>
